name: CI

on: [push, pull_request]

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Upgrade pip, setuptools and wheel
        run: python -m pip install --upgrade pip setuptools wheel
      - run: pip install -e ".[dev]"
      - name: Collection check (no import errors)
        run: pytest --co -q
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy core/ scanners/ apiKeyScan.py
      - name: Test with coverage and network guard
        run: pytest --cov=core --cov=scanners --cov=apiKeyScan --cov-report=term-missing --cov-report=xml --cov-fail-under=75
      - name: Verify network guard is active
        run: pytest tests/test_network_guard.py -v
